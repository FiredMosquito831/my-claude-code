# The documentation site, built from a staged copy of `docs/`.
#
#   uv run --offline python scripts/build_docs_site.py --out build/docs-src
#   uvx --with mkdocs-material --with mkdocs-glightbox mkdocs build --strict
#
# `docs_dir` is the STAGED directory, never `docs/` itself: the committed
# Markdown keeps the relative links that GitHub and the in-dashboard Docs page
# both resolve, and `scripts/build_docs_site.py` rewrites the handful that
# escape `docs/` on a copy. See that file's docstring for why.
#
# WHAT THIS SITE IS FOR
#
#   The README is the map and the dashboard's Docs page is the offline manual
#   for the version someone installed. This is the third reader: a search
#   engine, and a person who found the project through one. That is the whole
#   reason it exists, and it is why `site_url`, `site_description` and a
#   sitemap matter more here than the theme does -- on GitHub none of those
#   three are ours to set.

site_name: My Claude Code
site_description: >-
  My Claude Code (MCC) is a local multi-provider LLM proxy, model router and
  control plane for Claude Code, Codex, OpenCode, Gemini CLI and other AI
  coding agents — 57 providers, fallback routing, credential health, a native
  web-search tool proxy, and analytics with cost provenance.
site_author: FiredMosquito831

# The canonical origin every generated <link rel="canonical"> and every
# <loc> in the sitemap is written against. Nothing else in this file knows the
# host, which is the point: moving domain is this line.
#
# It is also the only absolute URL MkDocs emits into a page -- every link
# Material generates is relative (`..`, `../CLIENTS/`, `../assets/...`) and
# therefore moved to this domain for free. So a stale value here does not break
# a single link a human clicks; it only mis-states, to a search engine, where
# the real page lives. That is worse than it sounds: a canonical is an
# instruction, not a hint.
site_url: https://myclaudecode.danubelabs.net/

repo_url: https://github.com/FiredMosquito831/my-claude-code
repo_name: FiredMosquito831/my-claude-code
edit_uri: edit/main/docs/

copyright: >-
  AGPL-3.0-or-later, or a commercial licence. An independent open-source
  project, not affiliated with Anthropic, OpenAI, Google or OpenCode.

docs_dir: build/docs-src
site_dir: build/site

theme:
  name: material
  logo: assets/app-icon.png
  favicon: assets/app-icon.png
  # One template: `404.html`. GitHub Pages serves `/404.html` for an unknown
  # path, that file comes from the theme's `static_templates` rather than from
  # any Markdown page, and Material's own says "404 - Not found" and nothing
  # else. See the comment at the top of `overrides/404.html`.
  custom_dir: overrides
  # Dark by default, matching the dashboard the docs describe, with a light
  # scheme reachable for anyone who wants it.
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    # The nav has five top-level groups and a flat sidebar buries them: on a
    # site whose longest page is 345 KB, the sidebar is mostly that page's own
    # sections and the other four groups scroll out of sight. Tabs put the five
    # across the header and leave the sidebar to the group you are in.
    - navigation.tabs
    - navigation.sections
    # A section whose first child is its own index page becomes a clickable
    # section rather than a label that does nothing when you click it.
    - navigation.indexes
    # The footer's previous/next pair. The Usage Guide is a sequence and the
    # tutorials inside it are read in order; a reader who finishes one should
    # not have to go back to the sidebar to find the next.
    - navigation.footer
    - search.highlight
    - search.suggest
    # A search result is the thing worth sending someone, more often than the
    # page is: it carries the query as well as the page.
    - search.share
    - content.code.copy
    # Numbered annotations inside a code block, for the `.env` and config
    # samples where the explanation currently has to repeat the line first.
    - content.code.annotate
    - content.action.edit
    - toc.follow
    # Picking "Windows" in one tabbed block picks it in every tabbed block on
    # the page, and remembers it. The install block on the home page is
    # per-OS, and a Windows reader should not have to choose five times.
    - content.tabs.link

extra_css:
  - assets/site.css

plugins:
  - search
  # Click a screenshot, get the screenshot. The corpus is captured at 1500 px
  # and the content column is about 720 px wide, so every dashboard shot on
  # this site is rendered at roughly half size -- legible as a picture of a
  # page, unreadable as the page. This is the single biggest usability win
  # available to a docs site that is mostly pictures.
  #
  # A plugin, so it also has to be on the `uvx --with` line in
  # `.github/workflows/docs-site.yml`; nothing else here needs one.
  - glightbox:
      # The theme's own images -- the header logo, the social icons -- are not
      # content and must not open a lightbox. They are outside `.md-typeset`,
      # which the plugin already respects; this skips the one class of content
      # image that is a diagram rather than a screenshot only if it is ever
      # marked as such.
      skip_classes:
        - no-lightbox
      # The alt text is written for a screen reader and is a sentence long;
      # printing it over the image as a caption would cover the thing the
      # reader clicked to see.
      auto_caption: false
      touchNavigation: true
      draggable: true
      # BRAND.md §8: subtle motion only, and `prefers-reduced-motion` is
      # honoured by GLightbox's own CSS for the open/close transition.
      effect: fade
      slide_effect: slide

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # These pages are long -- USAGE alone is 345 KB -- so the table of
      # contents has to reach the sub-sections people actually link to.
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # `alternate_style` is the only style `content.tabs.link` works with. Used by
  # the site's home page; the committed Markdown under `docs/` deliberately
  # does not use it, because `=== "Windows"` renders as literal text on GitHub
  # and in the dashboard's Docs page, and those two readers come first.
  - pymdownx.tabbed:
      alternate_style: true
  # Deliberately NOT `pymdownx.emoji` with Material's icon index: its
  # configuration needs `!!python/name:` tags, and
  # `tests/contracts/test_docs_site_contract.py` reads this file with
  # `yaml.safe_load`, which refuses them. Material's grid cards work without
  # icons; the test that pins the published host does not work without
  # safe_load.

# Spelled out rather than inferred, so the order is the reading order rather
# than the alphabet, and so a new page in `docs/` is a deliberate addition
# here instead of appearing unannounced at the bottom of the menu.
# Each top-level entry below is a TAB, so there are five of them and they are
# named for what a reader wants rather than for how the repository is laid out.
#
# `index.md` is generated from `docs/_site_home.md` and `documentation.md` is
# `docs/README.md` -- see the staging script's docstring for why the site's
# home page is not the documentation index any more.
#
# BRAND and RELEASE-CHECKLIST are written for whoever BUILDS MCC, not whoever
# runs it, and the alternative was to drop them from the site entirely. They
# stay, under Project, for one reason: both are live URLs today and both are in
# the sitemap, and deleting an indexed page to tidy a menu trades a real 404
# for a cosmetic gain. The Project tab already keeps them out of the reader's
# path, which is all the separation they needed.
nav:
  - Home: index.md
  - Usage Guide: USAGE.md
  - Connect a client:
      - Clients: CLIENTS.md
      - Claude Code config: CLAUDE-CODE-CONFIG.md
      - Messaging: MESSAGING.md
  - Providers and routing:
      - Routing reference: ROUTING-REFERENCE.md
      - OAuth providers: OAUTH-PROVIDERS.md
      - Anthropic subscription: ANTHROPIC-SUBSCRIPTION.md
      - Web search: WEB-SEARCH.md
  - Project:
      - All documentation: documentation.md
      - Architecture: ARCHITECTURE.md
      - Contributing: CONTRIBUTING.md
      - Brand: BRAND.md
      - Release checklist: RELEASE-CHECKLIST.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FiredMosquito831/my-claude-code
      name: My Claude Code on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/my-claude-code/
      name: my-claude-code on PyPI
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/@firedmosquito831/my-claude-code
      name: My Claude Code on npm
