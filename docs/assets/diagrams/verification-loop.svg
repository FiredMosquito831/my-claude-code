<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="t13 d13" font-family="ui-monospace, Consolas, monospace">
<title id="t13">The verification loop: every request is logged, priced and inspectable, and the next change is checked against it</title>
<desc id="d13">A request is served and logged once with its attempts, tokens, cost and provenance. Analytics and the request detail let an operator verify what actually happened. A change to a tier, a chain or a key is applied, and the next requests are measured against the same log. The loop is what makes a routing decision checkable rather than assumed.</desc>
<defs>
<marker id="a13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6E84"/></marker>
</defs>
<g stroke="#5D6E84" stroke-width="1.5" fill="none">
<path d="M210 90 H300" marker-end="url(#a13)"/>
<path d="M510 90 H590" marker-end="url(#a13)"/>
<path d="M680 130 V190" marker-end="url(#a13)"/>
<path d="M590 220 H510" marker-end="url(#a13)"/>
<path d="M300 220 H210" marker-end="url(#a13)"/>
<path d="M120 190 V130" marker-end="url(#a13)"/>
</g>
<g font-size="12">
<rect x="20" y="50" width="190" height="80" rx="8" fill="#111821" stroke="#3FB950"/>
<text x="36" y="76" fill="#3FB950">1 · request served</text>
<text x="36" y="98" fill="#A9B7C6" font-size="11">the chain walked</text>
<text x="36" y="118" fill="#A9B7C6" font-size="11">the key that answered</text>
<rect x="300" y="50" width="210" height="80" rx="8" fill="#111821" stroke="#58A6FF"/>
<text x="316" y="76" fill="#58A6FF">2 · logged once</text>
<text x="316" y="98" fill="#A9B7C6" font-size="11">attempts, tokens, cost</text>
<text x="316" y="118" fill="#A9B7C6" font-size="11">the rung that priced it</text>
<rect x="590" y="50" width="250" height="80" rx="8" fill="#111821" stroke="#58A6FF"/>
<text x="606" y="76" fill="#58A6FF">3 · inspect</text>
<text x="606" y="98" fill="#A9B7C6" font-size="11">analytics, request detail</text>
<text x="606" y="118" fill="#A9B7C6" font-size="11">raw diagnostics on demand</text>
<rect x="590" y="190" width="250" height="80" rx="8" fill="#111821" stroke="#3FB950"/>
<text x="606" y="216" fill="#3FB950">4 · change</text>
<text x="606" y="238" fill="#A9B7C6" font-size="11">a tier, a chain, a key,</text>
<text x="606" y="258" fill="#A9B7C6" font-size="11">a reasoning or budget setting</text>
<rect x="300" y="190" width="210" height="80" rx="8" fill="#111821" stroke="#D29922"/>
<text x="316" y="216" fill="#D29922">5 · re-measure</text>
<text x="316" y="238" fill="#A9B7C6" font-size="11">the same log, the next</text>
<text x="316" y="258" fill="#A9B7C6" font-size="11">window of requests</text>
<rect x="20" y="190" width="190" height="80" rx="8" fill="#111821" stroke="#D29922"/>
<text x="36" y="216" fill="#D29922">6 · correct</text>
<text x="36" y="238" fill="#A9B7C6" font-size="11">pause a row, reorder</text>
<text x="36" y="258" fill="#A9B7C6" font-size="11">a chain, fix a key</text>
</g>
<g font-size="12" fill="#A9B7C6">
<text x="20" y="320">A dashboard number that cannot be traced to a row is not a measurement. Every total carries its denominator.</text>
<text x="20" y="344">A skipped model is still a row with its reason, so a working chain can be told from a lucky one.</text>
<text x="20" y="368">The site you are reading is built by the same discipline: a deterministic builder, a gate per claim, and a proof for each gate.</text>
</g>
<g font-size="12" fill="#A9B7C6">
<rect x="20" y="400" width="14" height="14" rx="3" fill="#111821" stroke="#3FB950"/><text x="42" y="412">action</text>
<rect x="110" y="400" width="14" height="14" rx="3" fill="#111821" stroke="#58A6FF"/><text x="132" y="412">evidence</text>
<rect x="220" y="400" width="14" height="14" rx="3" fill="#111821" stroke="#D29922"/><text x="242" y="412">correction</text>
</g>
</svg>
