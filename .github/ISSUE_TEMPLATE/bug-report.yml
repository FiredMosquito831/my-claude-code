name: Bug report
description: Report something that is not working in My Claude Code.
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Run `mcc-server --version` and enter only the version number, such as `5.0.0`. If MCC did not install, enter `None`.
      placeholder: "5.0.0 or None"
    validations:
      required: true

  - type: dropdown
    id: cli
    attributes:
      label: CLI
      description: If the problem occurred while using a coding CLI, select it.
      options:
        - Claude Code (mcc-claude)
        - Codex (mcc-codex)
        - Pi (mcc-pi)

  - type: input
    id: selected-models
    attributes:
      label: Selected model(s)
      description: If relevant, enter each model exactly as shown in the selector or configuration.
      placeholder: nvidia_nim/nvidia/nemotron-3-super-120b-a12b

  - type: textarea
    id: model-mappings
    attributes:
      label: Model mappings
      description: If relevant, enter the model mappings used when the problem occurred.
      placeholder: |
        MODEL_FABLE=
        MODEL_OPUS=
        MODEL_SONNET=
        MODEL_HAIKU=

  - type: input
    id: providers
    attributes:
      label: Provider(s)
      description: If relevant, enter the provider or providers involved.
      placeholder: NVIDIA NIM, OpenRouter

  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: Describe what happened and include any useful reproduction details. Remove API keys and tokens from logs or screenshots.
      placeholder: Tell us what went wrong.
    validations:
      required: true
