# The npm package's release build: one job, one publish, on every release.
#
# WHY THIS IS ITS OWN FILE AND NOT A JOB IN `shell-release.yml`
#
#   `shell-release.yml` is a four-runner matrix whose `release` job needs all
#   of it; an npm publish shares none of that -- no Rust, no artefacts, no
#   `contents: write` -- and adding a sibling job there would mean a job that
#   is unrelated to the shell inheriting the shell's concurrency group and its
#   dispatch inputs. Same event, separate file, separate blast radius.
#
# WHAT IT PUBLISHES
#
#   `packaging/npm/` -- the launcher, not the server. The server itself ships
#   as a wheel on the GitHub release; the npm package's postinstall runs the
#   repository's own install script. The two therefore have to agree on a
#   version, which is why the version check below is a hard failure and not a
#   warning: a tag that publishes a launcher claiming a version the Python
#   package never had is a package nobody can reason about.
#
# HOW IT AUTHENTICATES: TRUSTED PUBLISHING (OIDC), TOKEN ONLY AS A FALLBACK
#
#   npm's documented way to publish from CI is a trusted publisher: the
#   package on npmjs.com names this repository and this workflow file, the
#   job asks GitHub for a short-lived OIDC identity token (`id-token: write`),
#   and npm accepts the publish from that identity alone. No secret is stored
#   anywhere, nothing expires, nothing can leak, and because the repository is
#   public npm attaches a provenance attestation automatically. It needs npm
#   11.5.1 or newer, which is why the job upgrades npm before publishing.
#
#   The one-time setup is on npmjs.com, package Settings -> Trusted Publisher:
#   GitHub Actions, user `FiredMosquito831`, repository `my-claude-code`,
#   workflow filename `npm-release.yml`, environment empty. Until that exists
#   an OIDC publish is refused; the job then prints the setup as a warning
#   and ends green, because a release is a release of the *server* and the
#   shipping of a convenience launcher must never turn a good release red.
#
#   `NPM_TOKEN` (a granular access token with "Bypass two-factor
#   authentication") is honoured if it is set, as a fallback for a registry
#   that cannot do OIDC. With a token present a failed publish IS a failure:
#   the operator asked for it explicitly.

name: npm publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release tag to publish from, e.g. v6.53.1"
        required: true
        type: string

concurrency:
  # Per tag, and never cancelled: npm publishes are not idempotent to
  # interrupt, and the already-published guard below makes a re-run cheap.
  group: npm-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The OIDC identity token trusted publishing runs on, and what npm
      # signs the provenance attestation with.
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm that can do trusted publishing
        # Trusted publishing arrived in npm 11.5.1; the npm bundled with a
        # Node release can lag it.
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      - name: Decide how to authenticate
        # `secrets` cannot be read in an `if:` on a step, so the answer is
        # carried in an output. OIDC is the default; a token is only ever a
        # fallback the operator set on purpose.
        id: auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is set; publishing with the token instead of trusted publishing."
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "publishing via trusted publishing (OIDC); no token in play"
          fi

      - name: Stamp the version from the tag and check it against pyproject
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # The one contract between the two packages. `packaging/npm/
          # package.json` is also pinned to this by
          # `tests/contracts/test_npm_package_contract.py`, so a mismatch here
          # means the tag disagrees with the source, not that the source
          # drifted.
          pyproject="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$version" != "$pyproject" ]; then
            echo "::error::tag '$TAG' is version '$version' but pyproject.toml says '$pyproject'. Refusing to publish a launcher that claims a version the server never had."
            exit 1
          fi
          declared="$(node -p 'require("./packaging/npm/package.json").version')"
          if [ "$declared" != "$version" ]; then
            echo "::error::packaging/npm/package.json says '$declared' but the tag is '$version'. The version bump did not reach the npm package."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing $version"

      - name: Skip if this version is already on the registry
        id: registry
        working-directory: packaging/npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # 6.52.0 was published by hand before this workflow existed, and a
        # release can be re-run. `npm view` on a version that does not exist
        # exits non-zero with an E404, which is the answer and not an error --
        # hence `|| true` and a test on the printed value.
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          published="$(npm view "$name@$VERSION" version 2>/dev/null || true)"
          if [ "$published" = "$VERSION" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$VERSION is already published; nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish (trusted publishing)
        if: steps.auth.outputs.mode == 'oidc' && steps.registry.outputs.publish == 'true'
        working-directory: packaging/npm
        # setup-node writes an `_authToken=${NODE_AUTH_TOKEN}` line into the
        # runner's .npmrc; with no token exported npm ignores it and uses the
        # OIDC identity. A refusal here almost always means the trusted
        # publisher has not been configured on npmjs.com yet, so the job says
        # exactly what to do and stays green.
        run: |
          set -uo pipefail
          if npm publish --access public --provenance; then
            echo "published via trusted publishing"
          else
            echo "::warning::npm refused the trusted (OIDC) publish. One-time setup on npmjs.com: open the package, Settings -> Trusted Publisher -> GitHub Actions, user FiredMosquito831, repository my-claude-code, workflow filename npm-release.yml, environment empty, Save. The next release then publishes on its own. (A granular NPM_TOKEN secret with 'Bypass two-factor authentication' is honoured as a fallback.) The server release itself is unaffected."
          fi

      - name: npm publish (token fallback)
        if: steps.auth.outputs.mode == 'token' && steps.registry.outputs.publish == 'true'
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
