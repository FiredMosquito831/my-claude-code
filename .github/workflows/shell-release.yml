# The desktop shell's release build: four runners, one release.
#
# Branch protection does not gate on this workflow -- it runs *after* a release
# is published, not on a pull request. The pull-request gate for the shell is
# the `desktop-shell (cargo)` job in `tests.yml`, which still compiles, lints
# and unit-tests it on every change.
#
# There is one release stream (decision Q6). The Python release flow publishes
# the release with the wheel on it; this workflow then builds the shell on each
# supported platform and attaches the archives and a checksum file to that same
# release. That is provably safe: `_select_wheel_asset`
# (`application/release_updates.py`) returns the first asset whose name ends
# `.whl` and ignores every other asset, which
# `tests/application/test_release_updates_ignores_shell_assets.py` pins.

name: Desktop shell release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Where the assets go: the existing release tag to upload to, e.g. v6.43.0"
        required: true
        type: string
      ref:
        description: "What to build: a branch, tag or SHA. Leave empty to build the source at `tag`."
        required: false
        default: ""
        type: string

concurrency:
  # Per tag, and never cancelled: a half-uploaded set of release assets is
  # worse than a queued run.
  group: shell-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

# Read-only by default. Only the upload job is granted `contents: write`.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # Every leg runs even when one fails, so a release produces one report
      # naming all the broken platforms rather than the first one. The
      # workflow still fails: `release` needs `build`, so a failed leg means no
      # upload happens at all. Nothing here is `continue-on-error`.
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: MyClaudeCode.exe
            asset: MyClaudeCode-windows-x86_64.zip
          - name: linux-x86_64
            # The oldest supported base, because glibc is forward-compatible
            # only: a binary built here runs on newer distributions, and one
            # built on `ubuntu-latest` would not run on 22.04. NOTE: this
            # runner label retires 17 April 2027 -- before then, move this leg
            # into an older-glibc container on `ubuntu-latest`.
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: MyClaudeCode
            asset: MyClaudeCode-linux-x86_64.tar.gz
          - name: macos-aarch64
            # `macos-latest` is macOS 26 on Apple silicon.
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: MyClaudeCode
            asset: MyClaudeCode-macos-aarch64.tar.gz
          - name: macos-x86_64
            # `macos-13` was retired on 4 December 2025; `macos-15-intel` is
            # the Intel runner. Do not write `macos-13` here again.
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: MyClaudeCode
            asset: MyClaudeCode-macos-x86_64.tar.gz
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # What is *built*, which is not always what is uploaded to.
          #
          # On `release: published` these are the same thing and must be: the
          # tag carries the source that release is made of, so the shell
          # attached to it is built from it.
          #
          # A dispatch can separate them, and has to be able to. Backfilling a
          # release published before the shell existed -- or before a fix to
          # this very workflow landed -- means uploading to that tag while
          # building something newer, and pretending otherwise produces a
          # checkout with no `desktop-shell/` in it and four legs that fail on
          # a missing directory. `ref` says what to build; empty means the tag.
          ref: ${{ inputs.ref || github.event.release.tag_name || inputs.tag }}
          fetch-depth: 1

      - name: Check the shell is in this checkout
        # A directory that is not there produces "the directory name is
        # invalid" from the shell four steps later, which names neither the
        # cause nor the fix. Say both, once, here.
        env:
          BUILDING: ${{ inputs.ref || github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -f desktop-shell/src-tauri/Cargo.toml ]; then
            echo "::error::desktop-shell/ is not present at '$BUILDING'. The shell landed after that point in history. Re-dispatch naming a commit that has it, for example -f ref=main."
            exit 1
          fi
          echo "building the shell from $BUILDING"

      - name: Install the webview, tray and virtual-display packages
        if: runner.os == 'Linux'
        # webkit2gtk **4.1**, not 4.0: Ubuntu 24.04 does not ship 4.0 at all,
        # and 4.1 is the declared distribution floor. `xvfb` is for the smoke,
        # which runs a real window.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            desktop-file-utils \
            lintian

      - name: Install Rust
        # Pinned by commit SHA, as every other action in this repository is.
        # That SHA is the head of the action's `stable` branch, which installs
        # whatever Rust stable is on the day the job runs -- the pin fixes the
        # action, not the compiler.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: desktop-shell/src-tauri
          key: ${{ matrix.target }}

      - name: cargo test
        working-directory: desktop-shell/src-tauri
        run: cargo test --locked --target ${{ matrix.target }}

      - name: cargo build
        working-directory: desktop-shell/src-tauri
        # `cargo build --release --features custom-protocol` and not
        # `cargo tauri build --no-bundle`, deliberately. The Tauri CLI's
        # `build` does three things: run `beforeBuildCommand`, run cargo with
        # `--features custom-protocol`, and bundle. This project has no
        # `beforeBuildCommand` (`ui/` is one static HTML file, there is no
        # frontend build), and `--no-bundle` switches the third off -- so the
        # CLI would reduce to exactly the line below, at the cost of compiling
        # `tauri-cli` on four runners.
        #
        # The feature is not optional. Without it `tauri::is_dev()` is true and
        # the generated context reads `frontendDist` off the disk at runtime
        # instead of embedding it, so a shipped binary would look for a `ui/`
        # directory the user does not have. This is the single line that
        # separates a release build from a development one.
        run: cargo build --release --locked --features custom-protocol --target ${{ matrix.target }}

      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop-shell
        run: ./smoke/windows.ps1 -Binary "src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}"

      - name: Smoke (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop-shell
        run: ./smoke/linux.sh "src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}"

      - name: Smoke (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop-shell
        run: ./smoke/macos.sh "src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}"

      # Both packaging steps put the executable, and nothing else, in the
      # archive: no installer, no `.app`, no `.dmg` (decision Q7), no
      # AppImage. The name carries the platform and the architecture but never
      # a version (decision Q5), so a shortcut or a `.desktop` `Exec=` line
      # survives every upgrade and the Python-side pin in S4 can name one
      # asset per target forever.
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Force `
            -Path "desktop-shell/src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}" `
            -DestinationPath "dist/${{ matrix.asset }}"

      # ---------------------------------------------------------------
      # The Windows installer (delivery path B, spec S5).
      #
      # Inno Setup is fetched from the project's own GitHub release and
      # verified against a pinned digest, rather than installed from
      # Chocolatey: `choco install innosetup` follows the channel and would
      # have silently moved this job from Inno Setup 6 to 7 in August 2026.
      # A pinned URL plus a pinned SHA-256 is the same shape the rest of this
      # repository already uses for actions and for the shell's own assets.
      #
      # Source: https://jrsoftware.org/isdl.php -> is-6_7_3 on
      # github.com/jrsoftware/issrc. Bump the version and the digest together.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INNO_VERSION: "6.7.3"
          INNO_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-$($env:INNO_VERSION -replace '\.','_')/innosetup-$env:INNO_VERSION.exe"
          $exe = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:INNO_SHA256) {
            Write-Error "Inno Setup digest mismatch: expected $env:INNO_SHA256, got $actual"
          }
          $dir = Join-Path $env:RUNNER_TEMP "inno"
          $proc = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/NOICONS","/CURRENTUSER","/DIR=$dir"
          if ($proc.ExitCode -ne 0) { Write-Error "Inno Setup install exited $($proc.ExitCode)" }
          "ISCC=$dir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile the installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Where the assets go, which is what the installer must claim to be.
          # A dispatch that builds `main` into an old tag still stamps the tag.
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:TAG -replace '^v',''
          if ($version -notmatch '^[0-9]+(\.[0-9]+){1,3}$') {
            # VersionInfoVersion must be numeric. A tag that is not a version
            # (a dispatch smoke, say) still produces an installer, marked 0.0.0.
            Write-Host "::warning::'$env:TAG' is not a numeric version; stamping 0.0.0"
            $version = "0.0.0"
          }
          $exe = "$PWD\desktop-shell\src-tauri\target\$env:TARGET\release\MyClaudeCode.exe"
          & $env:ISCC "/DAppVersion=$version" "/DSourceExe=$exe" "/O$PWD\dist" `
            "desktop-shell\installer\windows\MyClaudeCode.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "iscc exited $LASTEXITCODE" }
          Get-ChildItem dist

      # `/VERYSILENT /SUPPRESSMSGBOXES /NORESTART` is the switch set winget
      # supplies automatically for `InstallerType: inno` (spec S8), so it is
      # not optional and it is not a detail: if it ever prompts, every
      # unattended install hangs forever. Prove it here, on every release,
      # rather than discovering it in a winget validation run.
      - name: Smoke the installer (silent install, launch, silent uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop-shell
        run: ./smoke/windows-installer.ps1 -Setup "../dist/MyClaudeCode-Setup-windows-x86_64.exe"

      - name: Package (tar, macOS)
        if: runner.os == 'macOS'
        env:
          # macOS `tar` otherwise writes an AppleDouble `._MyClaudeCode`
          # sidecar for any file carrying extended attributes, which would put
          # a second, junk member in an archive S4 extracts expecting one.
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}" \
            -C "desktop-shell/src-tauri/target/${{ matrix.target }}/release" \
            "${{ matrix.binary }}"

      # ---------------------------------------------------------------
      # Linux, delivery path B (spec S6). Two artefacts from one binary:
      # a .deb for Ubuntu and Debian, and the tarball -- which now carries a
      # per-user installer -- for Fedora, Arch, and anyone without root.
      #
      # The tarball is still the archive delivery path A fetches.
      # `config/desktop_shell.py` extracts the one member named
      # `MyClaudeCode` and ignores every other file, so the installer, the
      # desktop entry and the icons ride along without changing that
      # contract; `smoke/linux-tarball.sh` asserts exactly that shape, and
      # `tests/config/test_desktop_shell.py` asserts the Python half.
      - name: Package (tar, Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist
          stage="$(mktemp -d)"
          release="desktop-shell/src-tauri/target/${{ matrix.target }}/release"
          icons="desktop-shell/src-tauri/icons"
          installer="desktop-shell/installer/linux"

          install -m 0755 "$release/${{ matrix.binary }}" "$stage/${{ matrix.binary }}"
          install -m 0755 "$installer/install-desktop.sh" "$stage/install-desktop.sh"
          install -m 0644 "$installer/my-claude-code-desktop.desktop" \
            "$stage/my-claude-code-desktop.desktop"
          # The same four sizes build-deb.sh installs, named by size so the
          # per-user installer can place them without knowing the source
          # tree's own naming.
          install -d -m 0755 "$stage/icons"
          install -m 0644 "$icons/icon.png" "$stage/icons/512x512.png"
          install -m 0644 "$icons/128x128@2x.png" "$stage/icons/256x256.png"
          install -m 0644 "$icons/128x128.png" "$stage/icons/128x128.png"
          install -m 0644 "$icons/32x32.png" "$stage/icons/32x32.png"

          # Members are named explicitly and in a fixed order: `-C dir .`
          # would add a `./` prefix to every name and a `./` member of its
          # own, which is a change to an archive shape other code parses.
          tar -czf "dist/${{ matrix.asset }}" -C "$stage" \
            "${{ matrix.binary }}" \
            install-desktop.sh \
            my-claude-code-desktop.desktop \
            icons
          rm -rf "$stage"
          tar -tvzf "dist/${{ matrix.asset }}"

      - name: Build the .deb
        if: runner.os == 'Linux'
        env:
          # Where the assets go, which is what the package must claim to be --
          # the same rule the Windows installer follows.
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::warning::'$TAG' is not a numeric version; stamping 0.0.0"
            version="0.0.0"
          fi
          desktop-shell/installer/linux/build-deb.sh \
            --binary "desktop-shell/src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --version "$version" \
            --output "dist/MyClaudeCode-linux-x86_64.deb"

      # Lintian is ADVISORY, deliberately. Its full output is in the log and
      # is worth reading, but it does not gate the release: it ships new tags
      # with new versions, several of its error-level tags are true of this
      # package by design (no man page for a GUI, no debhelper token in a
      # hand-written maintainer script, an unstripped binary -- release builds
      # keep symbols so a crash report is readable), and a policy checker
      # turning a working package red on a Tuesday is not a trade this project
      # wants. The gate is the next two steps, which install the package, run
      # the program out of it, remove it and diff the filesystem back. A
      # lintian tag that matters should be fixed; one that appears on its own
      # should not stop a release.
      - name: lintian (advisory)
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail
          lintian --no-tag-display-limit \
            --suppress-tags no-manual-page,binary-without-manpage,unstripped-binary-or-object,maintainer-script-lacks-debhelper-token \
            dist/MyClaudeCode-linux-x86_64.deb || true

      # The proof, and the reason this leg exists: install the package on the
      # runner, assert every path it declared, run the *installed*
      # /usr/bin/MyClaudeCode under Xvfb, remove it, and diff the filesystem
      # back to what it was. The Windows counterpart is
      # `smoke/windows-installer.ps1`.
      - name: Smoke the .deb (install, run, remove, diff)
        if: runner.os == 'Linux'
        working-directory: desktop-shell
        run: ./smoke/linux-deb.sh "../dist/MyClaudeCode-linux-x86_64.deb"

      - name: Smoke the tarball's per-user installer
        if: runner.os == 'Linux'
        working-directory: desktop-shell
        run: ./smoke/linux-tarball.sh "../dist/${{ matrix.asset }}"

      - name: Checksum
        working-directory: dist
        # One `sha256  filename` line per artefact, exactly the shape
        # `sha256sum -c` reads and exactly the shape the Python pin in S4
        # parses. Two spaces, and no mode marker.
        #
        # The line is rebuilt from the digest rather than taken as printed,
        # because the printers disagree. Git for Windows' `sha256sum` defaults
        # to binary mode and writes `<digest> *<name>`; GNU coreutils on Linux
        # writes `<digest>  <name>`. Both are valid input to `-c`, but they are
        # not the same bytes, and a checksum file whose format depends on which
        # runner produced which line is a contract nobody can parse.
        #
        # This loops rather than naming `matrix.asset`, because the Windows leg
        # now produces two artefacts: the archive Path A fetches and the
        # installer a human downloads.
        run: |
          set -euo pipefail
          for artefact in *; do
            case "$artefact" in *.sha256) continue ;; esac
            if command -v sha256sum >/dev/null 2>&1; then
              digest="$(sha256sum "$artefact" | cut -d' ' -f1)"
            else
              digest="$(shasum -a 256 "$artefact" | cut -d' ' -f1)"
            fi
            printf '%s  %s\n' "$digest" "$artefact" > "$artefact.sha256"
          done
          cat ./*.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shell-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------
  # macOS, delivery path B (spec S9): one universal .dmg from the two macOS
  # legs' binaries.
  #
  # WHY THIS IS A SEPARATE JOB AND NOT A STEP ON A macOS LEG
  #
  #   A universal bundle needs both slices, and the two macOS legs are two
  #   different machines running at the same time. `lipo` cannot run until
  #   both have finished, which is what `needs: build` says. Doing it on the
  #   aarch64 leg instead would mean that leg waiting on the Intel one -- the
  #   matrix has no way to express that, so it would have to poll for an
  #   artifact that may never arrive, and a red Intel leg would hang the
  #   aarch64 one for its full timeout rather than failing it.
  #
  #   The trade is one extra macOS runner for two or three minutes (no cargo,
  #   no cache: it downloads two binaries and runs two shell scripts) against
  #   two per-arch images on the release page. One image is the better
  #   product: a person downloading a Mac app should not have to know which
  #   processor their Mac has, and Apple's own answer to that question has
  #   been the universal binary since 2020.
  #
  # The per-arch tarballs are still built and still uploaded: delivery path A
  # (`config/desktop_shell.py`) fetches exactly one of them per machine and
  # would gain nothing from downloading a second architecture it cannot run.
  macos-dmg:
    name: macos-universal (dmg)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || inputs.tag }}
          fetch-depth: 1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: legs
          pattern: shell-macos-*
          merge-multiple: true

      - name: Merge the two slices into one .app, then into a .dmg
        env:
          # Where the assets go, which is what the bundle must claim to be --
          # the same rule the Windows installer and the .deb follow.
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::warning::'$TAG' is not a numeric version; stamping 0.0.0"
            version="0.0.0"
          fi

          mkdir -p slices/aarch64 slices/x86_64 dist
          tar -xzf legs/MyClaudeCode-macos-aarch64.tar.gz -C slices/aarch64
          tar -xzf legs/MyClaudeCode-macos-x86_64.tar.gz -C slices/x86_64
          chmod 0755 slices/aarch64/MyClaudeCode slices/x86_64/MyClaudeCode

          desktop-shell/installer/macos/build-app.sh \
            --binary slices/aarch64/MyClaudeCode \
            --binary slices/x86_64/MyClaudeCode \
            --version "$version" \
            --output staging

          desktop-shell/installer/macos/build-dmg.sh \
            --app "staging/My Claude Code.app" \
            --output "dist/MyClaudeCode-macos-universal.dmg"

      # The proof, and the reason this job is not just two shell scripts:
      # mount the image, assert the bundle layout and every Info.plist key,
      # verify the ad-hoc seal, assert that `spctl` REJECTS it (it is unsigned;
      # a green spctl would mean the README's Gatekeeper paragraph is wrong),
      # run the program out of the image, detach, and diff /Applications and
      # ~/Applications back -- this smoke installs nothing at all.
      - name: Smoke the .dmg (mount, assert, run, detach, diff)
        working-directory: desktop-shell
        run: ./smoke/macos-dmg.sh "../dist/MyClaudeCode-macos-universal.dmg"

      - name: Checksum
        working-directory: dist
        # The same rebuilt-from-the-digest line every other leg writes, for
        # the same reason: the printers disagree about mode markers.
        run: |
          set -euo pipefail
          for artefact in *; do
            case "$artefact" in *.sha256) continue ;; esac
            digest="$(shasum -a 256 "$artefact" | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$artefact" > "$artefact.sha256"
          done
          cat ./*.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shell-macos-universal
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach to the release
    needs: [build, macos-dmg]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job in this workflow that may write. It builds nothing.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: staging
          pattern: shell-*
          merge-multiple: true

      - name: Assemble the checksum file
        working-directory: staging
        # Sorted, so the file is byte-identical whichever order the four legs
        # happened to finish in.
        run: |
          set -euo pipefail
          cat ./*.sha256 | LC_ALL=C sort -k2 > SHA256SUMS-desktop-shell.txt
          rm -f ./*.sha256
          # Four archives, the Windows installer, the Linux .deb and the
          # universal macOS .dmg.
          test "$(wc -l < SHA256SUMS-desktop-shell.txt)" -eq 7 \
            || { echo "::error::expected seven checksum lines"; exit 1; }
          cat SHA256SUMS-desktop-shell.txt
          sha256sum -c SHA256SUMS-desktop-shell.txt
          # The format is a published contract -- S4 parses this file to get
          # its (platform, arch) -> sha256 table -- so assert its shape here
          # rather than discovering a stray mode marker in Python months later.
          # The character class carries `A-Z` for `MyClaudeCode-Setup-...`.
          if grep -qvE '^[0-9a-f]{64}  MyClaudeCode-[A-Za-z0-9_.-]+$' SHA256SUMS-desktop-shell.txt; then
            echo "::error::a line is not '<64 hex><space><space><filename>'"
            exit 1
          fi
          grep -q '  MyClaudeCode-Setup-windows-x86_64\.exe$' SHA256SUMS-desktop-shell.txt \
            || { echo "::error::the Windows installer is missing from the checksum file"; exit 1; }
          grep -q '  MyClaudeCode-linux-x86_64\.deb$' SHA256SUMS-desktop-shell.txt \
            || { echo "::error::the Linux .deb is missing from the checksum file"; exit 1; }
          grep -q '  MyClaudeCode-macos-universal\.dmg$' SHA256SUMS-desktop-shell.txt \
            || { echo "::error::the macOS .dmg is missing from the checksum file"; exit 1; }
          echo "the checksum file is seven 'sha256  filename' lines"

      - name: Upload to the release
        working-directory: staging
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        # `--clobber`, so re-running a leg replaces its asset rather than
        # failing on a name that already exists.
        run: |
          set -euo pipefail
          ls -l
          gh release upload "$TAG" \
            MyClaudeCode-windows-x86_64.zip \
            MyClaudeCode-Setup-windows-x86_64.exe \
            MyClaudeCode-linux-x86_64.tar.gz \
            MyClaudeCode-linux-x86_64.deb \
            MyClaudeCode-macos-aarch64.tar.gz \
            MyClaudeCode-macos-x86_64.tar.gz \
            MyClaudeCode-macos-universal.dmg \
            SHA256SUMS-desktop-shell.txt \
            --clobber --repo "$GITHUB_REPOSITORY"
