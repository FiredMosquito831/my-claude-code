# The product site: build the generated docs/ site and prove it is reproducible.
#
# This workflow is additive. The documentation site keeps its own workflow and
# its own build; this one runs the site builder's gate, which rebuilds into a
# temporary directory and byte-compares the result with docs/. The same command
# runs locally: python scripts/build_site.py --check

name: Site check

on:
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "scripts/build_site.py"
      - "requirements-site.txt"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "scripts/build_site.py"
      - "requirements-site.txt"
      - ".github/workflows/site.yml"

permissions:
  contents: read

jobs:
  build-check:
    name: Build and byte-compare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the site requirements
        run: python -m pip install --requirement requirements-site.txt
      - name: Build and byte-compare
        run: python scripts/build_site.py --check
