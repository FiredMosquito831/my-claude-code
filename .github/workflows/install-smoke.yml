name: install smoke

# Two legs.
#
# Linux: the proof for scripts/install.sh -- a bare ubuntu-latest runner with uv
# and every Python removed from PATH, so the script has to provision uv, an
# interpreter and the tool environment itself. Everything it creates goes to
# scratch directories under the workspace -- nothing lands in the runner's real
# home -- and the job passes only if `mcc-server --version` answers afterwards.
#
# Windows: the proof for scripts/install.cmd, added with the CMD route in
# 6.64.0. It runs the batch file from cmd.exe -- the shape the README now leads
# with -- and checks the three things only a real run can show: that
# `-ExecutionPolicy Bypass -File` gets past the default policy, that every
# launcher lands in the scratch bin directory, and that %ERRORLEVEL% reaches
# the caller on both a success and a failure. The cross-platform contract tests
# in tests/scripts/test_installers.py do not depend on this job (WORKING-NOTES
# section 20: guard tests over runtime tests for cross-platform scripts).
#
# Both legs install the LATEST PUBLISHED release, not this branch's code: the
# thing under test is the script, and the wheel it fetches is whatever GitHub
# says is current. A release that has not happened yet cannot break this job.
#
# ONE ASYMMETRY, and it decides where the 6.73.0 restart legs can live:
# scripts/install.cmd downloads scripts/install.ps1 from **main**, by design
# (it is the published route, and every decision about what to install stays
# in one script). So the cmd steps exercise MAIN's install.ps1, never this
# branch's, and a switch this branch adds is an unknown option to them until
# it has merged. The restart legs therefore run:
#   * scripts/install.sh directly (the checkout's file), and
#   * scripts/install.ps1 directly through powershell.exe (the checkout's
#     file), rather than through install.cmd.
# The cmd route's own pass-through of --restart is pinned by
# tests/scripts/test_installer_restart.py, which reads the file rather than
# running it.
#
# AND ONE MORE, which decides what the restart legs may ASSERT. The wheel
# these jobs install is the LATEST PUBLISHED one -- so on the pull request
# that introduces the restart, the `mcc-server` on disk is the release
# BEFORE it and does not know `--report-holder`. The installer's documented
# behaviour in exactly that case is to fall back to a connect test: a free
# port is started into, an occupied one is reported and nothing is stopped.
# These legs therefore assert the half that is true of every version --
# --no-start starts nothing, --restart into a free port ends with a listener
# answering /health, the lock stands a second installer down, and episodes
# accumulate in the receipt. The stop-the-holder half needs a published
# wheel that knows the flag, and the run after this release is where it
# first proves itself here. For the same reason there is no "stop the
# scratch server" step: `mcc-server --stop-holder` on a build that predates
# the flag does not refuse it -- it ignores every argument but --version and
# STARTS a server, which would block the step until the job timed out. The
# runner is thrown away at the end of the job, so nothing needs stopping.

on:
  push:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - "scripts/install.cmd"
      - "scripts/install.ps1"
      - ".github/workflows/install-smoke.yml"
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/install.cmd"
      - "scripts/install.ps1"
      - ".github/workflows/install-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-machine:
    name: install.sh on a machine with no uv and no Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Stage a scratch profile and a PATH with no uv and no Python
        run: |
          set -eu
          scratch="${RUNNER_TEMP}/fresh-machine"
          mkdir -p \
            "${scratch}/uv-tools" \
            "${scratch}/uv-tool-bin" \
            "${scratch}/uv-python" \
            "${scratch}/uv-cache" \
            "${scratch}/config" \
            "${scratch}/home"
          {
            echo "UV_TOOL_DIR=${scratch}/uv-tools"
            echo "UV_TOOL_BIN_DIR=${scratch}/uv-tool-bin"
            echo "UV_PYTHON_INSTALL_DIR=${scratch}/uv-python"
            echo "UV_CACHE_DIR=${scratch}/uv-cache"
            echo "MCC_CONFIG_DIR=${scratch}/config"
            echo "MCC_OPEN_BROWSER=0"
            echo "XDG_CONFIG_HOME=${scratch}/home/.config"
            echo "XDG_DATA_HOME=${scratch}/home/.local/share"
            # A real machine has SHELL set; the runner does not.
            echo "SHELL=/bin/bash"
          } >> "$GITHUB_ENV"

          # A PATH holding a symlink to every command the runner's PATH offered
          # EXCEPT uv and every python. Dropping whole directories instead
          # would take curl and coreutils with them, which is not what a fresh
          # machine looks like -- it has curl and no Python.
          shadow="${scratch}/path-bin"
          mkdir -p "$shadow"
          old_ifs=$IFS
          IFS=:
          for entry in $PATH; do
            [ -d "$entry" ] || continue
            for candidate in "$entry"/*; do
              [ -f "$candidate" ] || continue
              name="$(basename "$candidate")"
              case "$name" in
                uv|uvx|python|python3|python3.*|python2|python2.*|py|pypy|pypy3)
                  echo "withholding: $candidate"
                  continue
                  ;;
              esac
              [ -e "$shadow/$name" ] || ln -s "$candidate" "$shadow/$name" 2>/dev/null || true
            done
          done
          IFS=$old_ifs
          echo "PATH=${shadow}" >> "$GITHUB_ENV"

      - name: Give the scratch configuration a port of its own
        run: |
          set -eu
          scratch="${RUNNER_TEMP}/fresh-machine"
          # The installer READS this file and never writes it, so the restart
          # legs below need it to exist before the first install. 8391 rather
          # than the default 8082: the port under test must be one nothing else
          # on the runner could be holding.
          printf 'HOST=127.0.0.1\nPORT=8391\nMCC_OPEN_BROWSER=0\n' \
            > "${scratch}/config/.env"
          cat "${scratch}/config/.env"

      - name: Prove the machine has no uv and no Python
        run: |
          set -eu
          echo "PATH=$PATH"
          for missing in uv uvx python python3; do
            if command -v "$missing" >/dev/null 2>&1; then
              echo "::error::$missing is still on PATH at $(command -v "$missing")"
              exit 1
            fi
            echo "not found (as required): $missing"
          done
          command -v curl >/dev/null 2>&1 || { echo "::error::curl is missing"; exit 1; }

      - name: Run scripts/install.sh
        # PSModulePath is how uv decides the shell is PowerShell, and a GitHub
        # runner exports it on Linux. Left set, `uv tool update-shell` refuses
        # with "updating PowerShell is currently unsupported" and fails an
        # install that had otherwise finished. No Linux machine a user installs
        # on has it, so the job drops it rather than the script working around
        # it.
        run: env -u PSModulePath sh scripts/install.sh

      - name: uv, Python 3.14 and MCC all landed in the scratch profile
        run: |
          set -eu
          scratch="${RUNNER_TEMP}/fresh-machine"

          # uv's own installer writes to $XDG_DATA_HOME/../bin when
          # XDG_DATA_HOME is set, which is the scratch profile here and not
          # $HOME/.local/bin. This step is a fresh shell with the withheld PATH,
          # exactly like the new terminal the closing message tells the user to
          # open, so it adds that directory the way a login shell would.
          PATH="${scratch}/home/.local/bin:$PATH"
          uv_bin="$(command -v uv || true)"
          [ -n "$uv_bin" ] || { echo "::error::install.sh did not provide uv"; exit 1; }
          echo "uv installed at: $uv_bin ($("$uv_bin" --version))"

          # The interpreter came from uv, into the scratch directory -- not from
          # the runner image, and not from a system Python.
          ls -1 "${scratch}/uv-python"
          test -n "$(ls -A "${scratch}/uv-python")" \
            || { echo "::error::UV_PYTHON_INSTALL_DIR is empty"; exit 1; }
          ls -1 "${scratch}/uv-python" | grep -q "cpython-3.14" \
            || { echo "::error::no uv-managed CPython 3.14 was installed"; exit 1; }

          # --no-bin means no python shim was dropped anywhere on PATH.
          if command -v python3 >/dev/null 2>&1; then
            echo "::error::a python3 appeared on PATH: $(command -v python3)"
            exit 1
          fi

          test -x "${scratch}/uv-tool-bin/mcc-server" \
            || { echo "::error::mcc-server is not in the scratch tool bin"; exit 1; }

      - name: mcc-server --version
        run: |
          set -eu
          version="$("${RUNNER_TEMP}/fresh-machine/uv-tool-bin/mcc-server" --version)"
          echo "$version"
          case "$version" in
            "my-claude-code "*) ;;
            *) echo "::error::unexpected version output: $version"; exit 1 ;;
          esac

      - name: The real home was never written to
        run: |
          set -eu
          for untouched in "$HOME/.mcc" "$HOME/.fcc"; do
            if [ -e "$untouched" ]; then
              echo "::error::$untouched was created outside the scratch profile"
              exit 1
            fi
          done
          echo "no config directory was created in the real home"

      # ---------------------------------------------------------------
      # 6.73.0: the installer updates AND restarts.
      #
      # The success condition of every one of these is a LISTENER ANSWERING on
      # the configured port -- never "the install exited 0". On 2026-09-11 two
      # installs exited 0 fifteen minutes apart with no server running through
      # either of them, which is the defect this release exists for.
      # ---------------------------------------------------------------
      # Every leg below runs the installer AGAIN, and `uv tool update-shell`
      # refuses with exit 2 when the executable directory is not on PATH but the
      # shell configuration files already name it -- the exact state the first
      # install leaves behind. Putting the directory on PATH is what a user's
      # next terminal does anyway, and it is what the closing message tells them
      # to open one for.
      - name: Put the scratch tool bin on PATH, as a new terminal would
        run: |
          set -eu
          scratch="${RUNNER_TEMP}/fresh-machine"
          echo "PATH=${scratch}/uv-tool-bin:${scratch}/home/.local/bin:${PATH}" >> "$GITHUB_ENV"

      - name: --no-start installs and starts nothing
        run: |
          # No `set -e` on the install itself: an exit code this step SWALLOWS
          # is an exit code nobody can act on, and the first run of this leg
          # failed with nothing on screen but "Process completed with exit code
          # 1". Capture it, print it, and print the receipt beside it.
          set -u
          env -u PSModulePath sh scripts/install.sh --no-start
          status=$?
          echo "install.sh --no-start exited ${status}"
          echo "--- the receipt ---"
          cat "${RUNNER_TEMP}/fresh-machine/config/updates/progress.json" || true
          echo "--- what is listening ---"
          ss -ltn || netstat -ltn || true
          if [ "$status" -ne 0 ]; then
            echo "::error::install.sh --no-start exited ${status}"
            exit 1
          fi
          if curl -fsS -o /dev/null -m 3 http://127.0.0.1:8391/health; then
            echo "::error::--no-start started a server anyway"
            exit 1
          fi
          echo "nothing is listening on 8391, as asked"

      - name: --restart ends with a listener answering /health
        run: |
          set -u
          env -u PSModulePath sh scripts/install.sh --restart
          status=$?
          echo "install.sh --restart exited ${status}"
          echo "--- the receipt ---"
          cat "${RUNNER_TEMP}/fresh-machine/config/updates/progress.json" || true
          if [ "$status" -ne 0 ]; then
            echo "::error::install.sh --restart exited ${status}"
            exit 1
          fi
          set -e
          waited=0
          until curl -fsS -o /dev/null -m 3 http://127.0.0.1:8391/health; do
            waited=$((waited + 1))
            if [ "$waited" -gt 60 ]; then
              echo "::error::no listener answered /health on 8391"
              cat "${RUNNER_TEMP}/fresh-machine/config/updates/"server-start-*.log || true
              exit 1
            fi
            sleep 1
          done
          echo "/health answered on 8391 -- which is the success condition, and"
          echo "not the install's exit code."
          # And the receipt says so, in the record the desktop window reads.
          tail -n 1 "${RUNNER_TEMP}/fresh-machine/config/updates/progress.json"
          tail -n 1 "${RUNNER_TEMP}/fresh-machine/config/updates/progress.json" \
            | grep -q '"restarted":true' \
            || { echo "::error::the receipt does not record the restart"; exit 1; }

      - name: An occupied port is reported and never taken by force
        run: |
          set -eu
          # The server started above is still on 8391. Whatever this build of
          # mcc-server can say about it, the one thing that must be true is that
          # the installer did not end up with a SECOND server on that socket and
          # did not kill anything it could not identify.
          env -u PSModulePath sh scripts/install.sh --restart 2>&1 | tee "${RUNNER_TEMP}/second.txt"
          waited=0
          until curl -fsS -o /dev/null -m 3 http://127.0.0.1:8391/health; do
            waited=$((waited + 1))
            [ "$waited" -gt 60 ] && { echo "::error::8391 stopped answering"; exit 1; }
            sleep 1
          done
          echo "8391 still answers"
          # Every episode is still in the receipt: nobody truncates it any more.
          episodes="$(grep -c '"stage":"episode"' \
            "${RUNNER_TEMP}/fresh-machine/config/updates/progress.json")"
          echo "episodes recorded: $episodes"
          [ "$episodes" -ge 3 ] \
            || { echo "::error::expected at least three episodes, got $episodes"; exit 1; }

      - name: A second installer finds the lock held and watches instead
        run: |
          set -eu
          lock="${RUNNER_TEMP}/fresh-machine/config/updates/update.lock"
          # A lock owned by a process that IS alive: this shell.
          printf '{"pid":%s,"started_at":0,"started_display":"00:00:00","source":"install.sh"}' \
            "$$" > "$lock"
          out="$(env -u PSModulePath sh scripts/install.sh --restart 2>&1)"
          status=$?
          echo "$out"
          [ "$status" -eq 0 ] || { echo "::error::expected exit 0, got $status"; exit 1; }
          case "$out" in
            *"watching it instead"*) ;;
            *) echo "::error::the second installer did not stand down"; exit 1 ;;
          esac
          # It stood down without touching the lock.
          grep -q "\"pid\":$$" "$lock" || { echo "::error::the lock was taken"; exit 1; }
          rm -f "$lock"

      - name: Missing curl is a clear, per-distro failure
        run: |
          set -eu
          # The one prerequisite install.sh cannot bootstrap. Stage a PATH
          # without curl and check the script names the package and exits 1.
          # A PATH holding apt-get and nothing else: no curl, so the check has
          # to fire, and apt-get present so the hint is the Debian one. Every
          # command install.sh runs before require_curl is a shell builtin.
          hidden="${RUNNER_TEMP}/no-curl"
          rm -rf "$hidden"
          mkdir -p "$hidden"
          ln -s /usr/bin/apt-get "$hidden/apt-get"
          set +e
          out="$(env PATH="$hidden" HOME="${RUNNER_TEMP}/fresh-machine/home" \
            /bin/sh scripts/install.sh 2>&1)"
          status=$?
          set -e
          echo "$out"
          [ "$status" -eq 1 ] || { echo "::error::expected exit 1, got $status"; exit 1; }
          case "$out" in
            *"curl is required and was not found."*) ;;
            *) echo "::error::the curl message did not appear"; exit 1 ;;
          esac
          case "$out" in
            *"apt-get install -y curl"*) ;;
            *) echo "::error::the Debian install command was not named"; exit 1 ;;
          esac

  windows-cmd:
    name: install.cmd on Windows, from cmd.exe
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      # Everything the install creates goes to scratch directories under the
      # workspace, so the runner's real profile is never written to -- the same
      # rule the Linux leg follows, and the same rule the implementer's
      # fresh-machine runs on a real machine follow.
      - name: Stage a scratch profile
        run: |
          mkdir "%RUNNER_TEMP%\cmd-smoke\uv-tools"
          mkdir "%RUNNER_TEMP%\cmd-smoke\uv-tool-bin"
          mkdir "%RUNNER_TEMP%\cmd-smoke\uv-python"
          mkdir "%RUNNER_TEMP%\cmd-smoke\uv-cache"
          mkdir "%RUNNER_TEMP%\cmd-smoke\config"
          echo UV_TOOL_DIR=%RUNNER_TEMP%\cmd-smoke\uv-tools>>"%GITHUB_ENV%"
          echo UV_TOOL_BIN_DIR=%RUNNER_TEMP%\cmd-smoke\uv-tool-bin>>"%GITHUB_ENV%"
          echo UV_PYTHON_INSTALL_DIR=%RUNNER_TEMP%\cmd-smoke\uv-python>>"%GITHUB_ENV%"
          echo UV_CACHE_DIR=%RUNNER_TEMP%\cmd-smoke\uv-cache>>"%GITHUB_ENV%"
          echo MCC_CONFIG_DIR=%RUNNER_TEMP%\cmd-smoke\config>>"%GITHUB_ENV%"
          echo UV_TOOL_UPDATE_SHELL=0>>"%GITHUB_ENV%"

      # The route under test is the published one: a batch file fetched with
      # curl.exe and run from cmd.exe. It is run from the checkout rather than
      # from the raw URL, because the point is to test THIS branch's file --
      # but it is byte-for-byte the file the URL serves after a merge.
      # `call` is not optional: a .cmd started from another .cmd WITHOUT it
      # transfers control and never comes back, so everything after the line
      # would silently not run -- which is exactly what the first version of
      # this job did.
      - name: Run scripts\install.cmd
        run: call scripts\install.cmd

      - name: mcc-server --version, through the shim in the scratch bin dir
        run: |
          "%RUNNER_TEMP%\cmd-smoke\uv-tool-bin\mcc-server.exe" --version
          if errorlevel 1 exit /b 1

      - name: Every launcher landed in the scratch tool bin
        shell: pwsh
        run: |
          $binDir = Join-Path $env:RUNNER_TEMP "cmd-smoke\uv-tool-bin"
          $shims = @(Get-ChildItem -LiteralPath $binDir -Filter "*.exe")
          Write-Host "$($shims.Count) launchers in $binDir"
          foreach ($name in @("mcc-server", "mcc-claude", "mcc-desktop", "my-claude-code")) {
            if (-not (Test-Path -LiteralPath (Join-Path $binDir "$name.exe") -PathType Leaf)) {
              Write-Host "::error::$name.exe is not in the scratch tool bin"
              exit 1
            }
          }

      - name: The real profile was never written to
        shell: pwsh
        run: |
          foreach ($untouched in @("$env:USERPROFILE\.mcc", "$env:USERPROFILE\.fcc")) {
            if (Test-Path -LiteralPath $untouched) {
              Write-Host "::error::$untouched was created outside the scratch profile"
              exit 1
            }
          }
          Write-Host "no config directory was created in the real profile"

      # A run that fails must return a non-zero code to cmd.exe and keep the
      # script it downloaded, naming it. `--version 0.0.0` has no release, so
      # the installer stops after the download.
      - name: A failed run propagates ERRORLEVEL and keeps the script
        run: |
          call scripts\install.cmd --version 0.0.0
          if "%ERRORLEVEL%"=="0" (
            echo ::error::a failed install returned 0
            exit /b 1
          )
          if not exist "%TEMP%\install-mcc.ps1" (
            echo ::error::the downloaded installer was not kept for inspection
            exit /b 1
          )
          echo the failure returned %ERRORLEVEL% and kept %TEMP%\install-mcc.ps1
          exit /b 0

      # 6.73.0, run against THIS branch's install.ps1 rather than through
      # install.cmd, because install.cmd downloads install.ps1 from main (see
      # the header) and main does not know the switch until this has merged.
      - name: -NoStart installs and starts nothing
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP "cmd-smoke\config"
          Set-Content -LiteralPath (Join-Path $config ".env") `
            -Value "HOST=127.0.0.1`nPORT=8391`nMCC_OPEN_BROWSER=0`n" -Encoding ascii
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -NoStart
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::install failed"; exit 1 }
          try {
            $null = Invoke-WebRequest -Uri "http://127.0.0.1:8391/health" -UseBasicParsing -TimeoutSec 3
            Write-Host "::error::-NoStart started a server anyway"
            exit 1
          } catch {
            Write-Host "nothing is listening on 8391, as asked"
          }

      - name: -Restart starts the server and /health answers
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Restart
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::install failed"; exit 1 }
          $config = Join-Path $env:RUNNER_TEMP "cmd-smoke\config"
          $deadline = (Get-Date).AddSeconds(60)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8391/health" -UseBasicParsing -TimeoutSec 3
              if ([int] $response.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Milliseconds 750
          }
          if (-not $ok) {
            Write-Host "::error::no listener answered /health on 8391"
            Get-ChildItem (Join-Path $config "updates") | ForEach-Object { Write-Host $_.Name }
            exit 1
          }
          $last = (Get-Content -LiteralPath (Join-Path $config "updates\progress.json") | Where-Object { $_.Trim() })[-1]
          Write-Host $last
          if ($last -notmatch '"restarted"\s*:\s*true') {
            Write-Host "::error::the receipt does not record the restart"
            exit 1
          }

      - name: An unknown flag is refused before anything is downloaded
        run: |
          call scripts\install.cmd --not-a-flag
          if not "%ERRORLEVEL%"=="2" (
            echo ::error::expected exit 2 for an unknown flag, got %ERRORLEVEL%
            exit /b 1
          )
          exit /b 0
