<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="t2 d2" font-family="ui-monospace, Consolas, monospace">
<title id="t2">The lifecycle of one request through the proxy</title>
<desc id="d2">Seven numbered stages: ingress authentication and request validation; tier and model resolution; reasoning and output-budget resolution; credential selection from a healthy key; an upstream attempt; the fallback chain when an attempt fails; and the reply, which is translated back to the client's protocol and priced and logged once.</desc>
<defs>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6E84"/></marker>
</defs>
<g stroke="#5D6E84" stroke-width="1.5" fill="none">
<path d="M180 80 H240" marker-end="url(#a2)"/>
<path d="M420 80 H480" marker-end="url(#a2)"/>
<path d="M660 80 H700" marker-end="url(#a2)"/>
<path d="M760 110 V190" marker-end="url(#a2)"/>
<path d="M700 220 H660" marker-end="url(#a2)"/>
<path d="M480 220 H420" marker-end="url(#a2)"/>
<path d="M240 220 H180" marker-end="url(#a2)"/>
</g>
<g font-size="12">
<g>
<rect x="20" y="50" width="160" height="60" rx="8" fill="#111821" stroke="#3FB950"/>
<text x="34" y="74" fill="#3FB950">1 · ingress</text>
<text x="34" y="94" fill="#A9B7C6" font-size="11">auth, validate</text>
</g>
<g>
<rect x="240" y="50" width="180" height="60" rx="8" fill="#111821" stroke="#3FB950"/>
<text x="254" y="74" fill="#3FB950">2 · route</text>
<text x="254" y="94" fill="#A9B7C6" font-size="11">tier → model</text>
</g>
<g>
<rect x="480" y="50" width="180" height="60" rx="8" fill="#111821" stroke="#3FB950"/>
<text x="494" y="74" fill="#3FB950">3 · shape</text>
<text x="494" y="94" fill="#A9B7C6" font-size="11">reasoning · budget</text>
</g>
<g>
<rect x="700" y="50" width="140" height="60" rx="8" fill="#111821" stroke="#58A6FF"/>
<text x="714" y="74" fill="#58A6FF">4 · credential</text>
<text x="714" y="94" fill="#A9B7C6" font-size="11">a healthy key</text>
</g>
<g>
<rect x="700" y="190" width="140" height="60" rx="8" fill="#111821" stroke="#D29922"/>
<text x="714" y="214" fill="#D29922">5 · attempt</text>
<text x="714" y="234" fill="#A9B7C6" font-size="11">upstream call</text>
</g>
<g>
<rect x="480" y="190" width="180" height="60" rx="8" fill="#111821" stroke="#D29922"/>
<text x="494" y="214" fill="#D29922">6 · fallback</text>
<text x="494" y="234" fill="#A9B7C6" font-size="11">next model, next key</text>
</g>
<g>
<rect x="240" y="190" width="180" height="60" rx="8" fill="#111821" stroke="#3FB950"/>
<text x="254" y="214" fill="#3FB950">7 · reply</text>
<text x="254" y="234" fill="#A9B7C6" font-size="11">translate back</text>
</g>
<g>
<rect x="20" y="190" width="160" height="60" rx="8" fill="#111821" stroke="#58A6FF"/>
<text x="34" y="214" fill="#58A6FF">price · log once</text>
<text x="34" y="234" fill="#A9B7C6" font-size="11">provenance kept</text>
</g>
</g>
<g font-size="12" fill="#A9B7C6">
<text x="20" y="300">A request stops at the first stage that fails, and the failure keeps the protocol's own envelope.</text>
<text x="20" y="322">Once the first streamed chunk has left, status is committed: the client sees an in-band error, not a second HTTP status.</text>
<text x="20" y="344">Every attempt, including the ones that were skipped, is a row in the request log.</text>
</g>
<g font-size="12" fill="#A9B7C6">
<rect x="20" y="378" width="14" height="14" rx="3" fill="#111821" stroke="#3FB950"/><text x="42" y="390">normal stage</text>
<rect x="150" y="378" width="14" height="14" rx="3" fill="#111821" stroke="#D29922"/><text x="172" y="390">failure path</text>
<rect x="290" y="378" width="14" height="14" rx="3" fill="#111821" stroke="#58A6FF"/><text x="312" y="390">state and accounting</text>
</g>
</svg>
