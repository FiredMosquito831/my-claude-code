<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="t6 d6" font-family="ui-monospace, Consolas, monospace">
<title id="t6">The three signals that can change a key's health, and what each one costs</title>
<desc id="d6">A 401 or 403 walks an escalating lockout ladder of five minutes, one hour and one day on its own counter. A 429 benches only the key-and-model pair for the provider's published wait, and the key stays healthy for its other models. An exhausted-credit refusal benches the whole key for the cooldown window. Timeouts, 5xx, 410 and other 4xx leave health untouched.</desc>
<g font-size="12">
<g>
<rect x="20" y="30" width="250" height="100" rx="8" fill="#111821" stroke="#F85149"/>
<text x="36" y="58" fill="#F85149" font-weight="700">401 / 403 rejected</text>
<text x="36" y="82" fill="#A9B7C6">the provider refused the credential</text>
<text x="36" y="104" fill="#A9B7C6" font-size="11">escalating lockout, own counter</text>
</g>
<g>
<rect x="305" y="30" width="250" height="100" rx="8" fill="#111821" stroke="#D29922"/>
<text x="321" y="58" fill="#D29922" font-weight="700">429 throttled</text>
<text x="321" y="82" fill="#A9B7C6">the provider limited one model</text>
<text x="321" y="104" fill="#A9B7C6" font-size="11">bench the (key, model) pair</text>
</g>
<g>
<rect x="590" y="30" width="250" height="100" rx="8" fill="#111821" stroke="#D29922"/>
<text x="606" y="58" fill="#D29922" font-weight="700">Credits exhausted</text>
<text x="606" y="82" fill="#A9B7C6">the account behind the key is empty</text>
<text x="606" y="104" fill="#A9B7C6" font-size="11">a wallet is not per model</text>
</g>
</g>
<g font-size="12" fill="#A9B7C6">
<rect x="20" y="170" width="250" height="120" rx="8" fill="#111821" stroke="#5D6E84"/>
<text x="36" y="196" fill="#E6EDF3">Cost: the key, on its own ladder</text>
<text x="36" y="222" fill="#A9B7C6" font-size="11">5 min → 1 h → 24 h</text>
<text x="36" y="244" fill="#A9B7C6" font-size="11">one step per consecutive rejection</text>
<text x="36" y="266" fill="#A9B7C6" font-size="11">stays at the last entry</text>
<rect x="305" y="170" width="250" height="120" rx="8" fill="#111821" stroke="#5D6E84"/>
<text x="321" y="196" fill="#E6EDF3">Cost: one pair, one window</text>
<text x="321" y="222" fill="#A9B7C6" font-size="11">exactly the provider's Retry-After</text>
<text x="321" y="244" fill="#A9B7C6" font-size="11">key stays HEALTHY</text>
<text x="321" y="266" fill="#A9B7C6" font-size="11">escalates only at N models at once</text>
<rect x="590" y="170" width="250" height="120" rx="8" fill="#111821" stroke="#5D6E84"/>
<text x="606" y="196" fill="#E6EDF3">Cost: the whole key</text>
<text x="606" y="222" fill="#A9B7C6" font-size="11">for the cooldown window</text>
<text x="606" y="244" fill="#A9B7C6" font-size="11">a bare 402 with no phrase</text>
<text x="606" y="266" fill="#A9B7C6" font-size="11">charges nothing</text>
</g>
<g font-size="12">
<rect x="20" y="320" width="820" height="82" rx="8" fill="#111821" stroke="#5D6E84"/>
<text x="36" y="344" fill="#E6EDF3">Leaves health untouched: timeouts, 5xx, 410 model gone, overloaded, context overflow, other 4xx,</text>
<text x="36" y="366" fill="#A9B7C6" font-size="11">and a country refusal (403 RegionError). Those are properties of the model, the request or the</text>
<text x="36" y="388" fill="#A9B7C6" font-size="11">address, not of the credential.</text>
</g>
<g font-size="12" fill="#A9B7C6">
<rect x="20" y="412" width="14" height="14" rx="3" fill="#111821" stroke="#F85149"/><text x="42" y="424">credential</text>
<rect x="150" y="412" width="14" height="14" rx="3" fill="#111821" stroke="#D29922"/><text x="172" y="424">throttle or billing</text>
</g>
</svg>
