<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="t5 d5" font-family="ui-monospace, Consolas, monospace">
<title id="t5">One provider's key pool, its four rotation policies and its health states</title>
<desc id="d5">A provider holds an ordered pool of keys. Each key has its own upstream client and rate-limit window. Four policies read the pool order: single, round robin, least used, and failover. A key is healthy, benched for one model, locked out after an auth rejection, or benched whole after a billing refusal.</desc>
<g font-size="12">
<rect x="20" y="30" width="300" height="210" rx="8" fill="#111821" stroke="#5D6E84"/>
<text x="36" y="56" fill="#E6EDF3" font-weight="700">Key pool (order is read top to bottom)</text>
<rect x="36" y="72" width="268" height="30" rx="5" fill="#18212C" stroke="#3FB950"/><text x="50" y="92" fill="#3FB950">key 1 · healthy</text>
<rect x="36" y="110" width="268" height="30" rx="5" fill="#18212C" stroke="#3FB950"/><text x="50" y="130" fill="#3FB950">key 2 · healthy</text>
<rect x="36" y="148" width="268" height="30" rx="5" fill="#18212C" stroke="#D29922"/><text x="50" y="168" fill="#D29922">key 3 · benched (one model)</text>
<rect x="36" y="186" width="268" height="30" rx="5" fill="#18212C" stroke="#5D6E84"/><text x="50" y="206" fill="#A9B7C6">key 4 · locked out (401/403)</text>
<rect x="360" y="30" width="250" height="210" rx="8" fill="#111821" stroke="#5D6E84"/>
<text x="376" y="56" fill="#E6EDF3" font-weight="700">Rotation policy</text>
<text x="376" y="84" fill="#A9B7C6">single</text>
<text x="376" y="108" fill="#A9B7C6">round_robin</text>
<text x="376" y="132" fill="#A9B7C6">least_used</text>
<text x="376" y="156" fill="#A9B7C6">failover / on_error</text>
<text x="376" y="190" fill="#7D8FA3" font-size="11">per pool, on the provider card</text>
<rect x="630" y="30" width="210" height="210" rx="8" fill="#111821" stroke="#5D6E84"/>
<text x="646" y="56" fill="#E6EDF3" font-weight="700">Try another key?</text>
<text x="646" y="84" fill="#3FB950">401 / 403</text>
<text x="646" y="108" fill="#3FB950">429</text>
<text x="646" y="132" fill="#3FB950">transport fault</text>
<text x="646" y="166" fill="#7D8FA3" font-size="11">nothing else does</text>
</g>
<g font-size="12" fill="#A9B7C6">
<text x="20" y="276">A different key means a different account or connection. A timeout, a 5xx, a 410 or a</text>
<text x="20" y="298">plain 400 is the model's answer, and every key would hear it.</text>
<text x="20" y="320">Every key tried in a request is remembered as an avoid set, so rotation cannot end with</text>
<text x="20" y="342">keys untried. The pool never invents a ceiling: a wait comes from the provider's own</text>
<text x="20" y="364">Retry-After, and a status comes from its own response.</text>
</g>
<g font-size="12" fill="#A9B7C6">
<rect x="20" y="388" width="14" height="14" rx="3" fill="#18212C" stroke="#3FB950"/><text x="42" y="400">serving</text>
<rect x="130" y="388" width="14" height="14" rx="3" fill="#18212C" stroke="#D29922"/><text x="152" y="400">benched</text>
<rect x="240" y="388" width="14" height="14" rx="3" fill="#18212C" stroke="#5D6E84"/><text x="262" y="400">locked out</text>
</g>
</svg>
