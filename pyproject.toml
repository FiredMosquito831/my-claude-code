[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-claude-code"
version = "5.49.0"
description = "Local proxy connecting coding agents to OpenAI-compatible AI providers"
readme = "README.md"
requires-python = ">=3.14.0"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "uvicorn>=0.50.0",
    "httpx[socks]>=0.28.1",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.13.0",
    "python-telegram-bot>=22.8",
    "discord.py>=2.7.1",
    "pydantic-settings>=2.14.2",
    "openai>=2.54.0,<3",
    "google-auth[requests]>=2.56.3",
    "requests[socks]>=2.34.2",
    "loguru>=0.7.0",
    "aiohttp>=3.14.1",
    "jsonschema>=4.25.0",
    "ddgs>=9.14.4",
    "openpyxl>=3.1.5",
    "pillow>=11.4.0",
    "pystray>=0.19.5; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[project.scripts]
# Native command family (my-claude-code owner) — the canonical implementation.
mcc-server = "my_claude_code.cli.entrypoints:serve"
my-claude-code = "my_claude_code.cli.entrypoints:serve"
mcc-init = "my_claude_code.cli.entrypoints:init"
mcc-claude = "my_claude_code.cli.launchers.claude:launch"
mcc-claude-old = "my_claude_code.cli.launchers.claude:launch_legacy"
mcc-codex = "my_claude_code.cli.launchers.codex:launch"
mcc-pi = "my_claude_code.cli.launchers.pi:launch"
mcc-chatgpt-oauth-login = "my_claude_code.cli.entrypoints:chatgpt_oauth_login"
mcc-anthropic-oauth-login = "my_claude_code.cli.entrypoints:anthropic_oauth_login"
mcc-compact-log = "my_claude_code.cli.entrypoints:compact_log"
mcc-rtk = "my_claude_code.cli.entrypoints:rtk"
mcc-help = "my_claude_code.cli.entrypoints:help_command"
# Legacy command family (free-claude-code owner) — preserved as aliases that
# resolve through the canonical my_claude_code implementation (or the
# free_claude_code compatibility shim that re-exports it).
fcc-server = "my_claude_code.cli.entrypoints:serve"
free-claude-code = "my_claude_code.cli.entrypoints:serve"
fcc-init = "my_claude_code.cli.entrypoints:init"
fcc-claude = "my_claude_code.cli.launchers.claude:launch"
fcc-claude-old = "my_claude_code.cli.launchers.claude:launch_legacy"
fcc-codex = "my_claude_code.cli.launchers.codex:launch"
fcc-pi = "my_claude_code.cli.launchers.pi:launch"
fcc-chatgpt-oauth-login = "my_claude_code.cli.entrypoints:chatgpt_oauth_login"
fcc-anthropic-oauth-login = "my_claude_code.cli.entrypoints:anthropic_oauth_login"
fcc-compact-log = "my_claude_code.cli.entrypoints:compact_log"
fcc-rtk = "my_claude_code.cli.entrypoints:rtk"
fcc-help = "my_claude_code.cli.entrypoints:help_command"

[project.gui-scripts]
mcc-desktop = "my_claude_code.cli.desktop_entrypoint:launch"
fcc-desktop = "my_claude_code.cli.desktop_entrypoint:launch"

[project.optional-dependencies]
voice = [
    "grpcio>=1.81.1",
    "grpcio-tools>=1.81.1",
    "nvidia-riva-client>=2.26.0",
]
voice_local = [
    "torch>=2.12.1",
    "transformers>=5.13.0",
    "accelerate>=1.14.0",
    "librosa>=0.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/my_claude_code", "src/free_claude_code"]

[tool.hatch.build.targets.wheel.force-include]
".env.example" = "my_claude_code/config/env.example"
# User-facing documentation, rendered by the dashboard's Docs page. Bundled
# rather than fetched so the page works offline and shows the docs for the
# version that is actually installed. Kept in sync by DOCUMENTS in
# src/my_claude_code/api/docs_content.py; tests/api/test_docs_bundle_wheel.py
# builds a real wheel and fails if any of them is missing from it.
"README.md" = "my_claude_code/docs_bundle/README.md"
"ARCHITECTURE.md" = "my_claude_code/docs_bundle/ARCHITECTURE.md"
"CONTRIBUTING.md" = "my_claude_code/docs_bundle/CONTRIBUTING.md"
"docs/USAGE.md" = "my_claude_code/docs_bundle/USAGE.md"
"docs/CLAUDE-CODE-CONFIG.md" = "my_claude_code/docs_bundle/CLAUDE-CODE-CONFIG.md"
"docs/ANTHROPIC-SUBSCRIPTION.md" = "my_claude_code/docs_bundle/ANTHROPIC-SUBSCRIPTION.md"

[tool.uv]
required-version = ">=0.11.0"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ty>=0.0.56",
    "ruff>=0.15.20",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (undefined names, unused imports)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modernise syntax for target Python version)
    "B",    # flake8-bugbear (common bugs and anti-patterns)
    "C4",   # flake8-comprehensions (idiomatic comprehensions)
    "SIM",  # flake8-simplify (simplifiable code patterns)
    "PERF", # Perflint (performance anti-patterns)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line too long — enforced by the formatter instead
    "B008",  # FastAPI Depends() in argument defaults is intentional
    "RUF006",  # fire-and-forget tasks intentionally not awaited
]

[tool.ruff.lint.isort]
known-first-party = ["my_claude_code", "smoke"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-n auto --dist loadgroup"
testpaths = ["tests"]
markers = [
    "live: opt-in local smoke tests that can touch real services",
    "interactive: smoke tests requiring manual user interaction",
    "provider: live provider checks",
    "messaging: live messaging platform checks",
    "cli: CLI integration checks",
    "clients: client compatibility checks",
    "voice: voice transcription checks",
    "contract: deterministic feature contract checks",
    "smoke_target(name): route a smoke test behind FCC_SMOKE_TARGETS",
    "xdist_group(name): group smoke provider items under pytest-xdist --dist=loadgroup",
]

[tool.ty.environment]
python-version = "3.14"
python-platform = "all"

[tool.ty.analysis]
# Optional voice_local extra: torch, transformers, librosa for local whisper transcription
# Optional voice extra: nvidia-riva-client for nvidia_nim transcription provider
allowed-unresolved-imports = [
    "torch",
    "transformers",
    "librosa",
    "riva.client",
    "pystray",
    "webview",
]
